<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Protected Financial Report</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --pos: #059669;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    html { scroll-behavior: smooth; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
    .muted { color: var(--muted); }
    .pos { color: var(--pos); font-weight: 600; }

    /* Lock Screen */
    .lock-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: linear-gradient(145deg, #f1f5f9 0%, #e2e8f0 100%);
    }
    .lock-card {
      width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.09); text-align: center;
    }
    .lock-icon {
      width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 12px;
      background: #eff6ff; color: var(--primary); display: flex; align-items: center; justify-content: center;
    }
    .lock-card h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
    .lock-card p { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }
    .pw-group { position: relative; margin-bottom: 12px; }
    .pw-input {
      width: 100%; padding: 11px 44px 11px 14px; border: 1px solid #cbd5e1;
      border-radius: 10px; font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .pw-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14); }
    .pw-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 4px 6px;
    }
    .btn-primary {
      width: 100%; padding: 11px 16px; background: var(--primary); color: #fff; border: none;
      border-radius: 10px; font-size: 14.5px; font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.65; cursor: wait; }
    .lock-err { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 20px; }
    .lock-foot { margin-top: 18px; font-size: 12px; color: #94a3b8; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.32s ease; }

    /* App Layout */
    .app-shell { max-width: 1140px; margin: 0 auto; padding: 24px 20px 56px; display: flex; flex-direction: column; gap: 20px; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    .eyebrow { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primary); margin-bottom: 4px; }
    .topbar h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
    .topbar-actions { display: flex; gap: 8px; }
    .btn-outline {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .btn-outline:hover { background: #f1f5f9; }

    /* Sticky Jump Nav */
    .jump-nav {
      position: sticky; top: 0; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
    }
    .jump-nav a {
      text-decoration: none; color: #334155; font-size: 12.5px; font-weight: 600;
      padding: 5px 11px; border-radius: 7px; transition: background .15s, color .15s;
    }
    .jump-nav a:hover { background: #f1f5f9; color: var(--primary); }
    .jump-nav a.nav-highlight { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
      scroll-margin-top: 68px;
    }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .card h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .card-head p { margin: 4px 0 0; font-size: 13.5px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; scroll-margin-top: 68px; }
    .kpi { padding: 16px 18px; }
    .kpi-accent { background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%); border-color: #bbf7d0; }
    .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .kpi-value { font-size: 25px; font-weight: 700; margin: 4px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .kpi-value .unit { font-size: 14px; font-weight: 500; color: var(--muted); }
    .kpi-sub { font-size: 12px; color: var(--muted); }

    /* Visual Yield Curve Chart */
    .yield-chart {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin-bottom: 18px;
    }
    .yc-title { font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 12px; }
    .yc-rows { display: flex; flex-direction: column; gap: 9px; }
    .yc-row { display: grid; grid-template-columns: 235px 1fr 140px; align-items: center; gap: 12px; font-size: 12.5px; }
    .yc-track { background: #e2e8f0; border-radius: 6px; height: 24px; overflow: hidden; }
    .yc-fill {
      height: 100%; display: flex; align-items: center; padding: 0 10px;
      color: #fff; font-weight: 700; font-size: 12px; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .yc-muted { background: #64748b; }
    .yc-blue { background: #2563eb; }
    .yc-teal { background: #0d9488; }
    .yc-green { background: #059669; }
    .yc-emerald { background: #047857; }
    .yc-tag { font-size: 11.5px; text-align: right; color: var(--muted); }

    /* 3-Card Strategy Comparison */
    .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
    .opt-card {
      border: 1px solid var(--border); border-radius: 12px; padding: 18px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px; background: #fff;
    }
    .opt-featured { border: 2px solid #10b981; background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 42%); }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      padding: 3px 8px; border-radius: 999px; background: #f1f5f9; color: #334155; margin-bottom: 8px;
    }
    .badge-rec { background: #10b981; color: #fff; }
    .opt-num { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--text); }
    .opt-num small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 2px; }
    .opt-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .opt-list { margin: 0; padding-left: 18px; font-size: 12.5px; color: #334155; display: flex; flex-direction: column; gap: 6px; }
    .btn-opt {
      width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: #f8fafc; color: var(--text); font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    .btn-opt:hover { border-color: var(--primary); color: var(--primary); }
    .btn-opt-rec { background: #059669; border-color: #059669; color: #fff; }
    .btn-opt-rec:hover { background: #047857; color: #fff; }

    /* Step-by-Step Blueprint */
    .blueprint-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
    .blueprint-box h3 { margin: 0 0 12px; font-size: 14.5px; font-weight: 700; }
    .steps-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .step-item {
      display: flex; gap: 11px; align-items: flex-start;
      background: #fff; border: 1px solid var(--border); border-radius: 9px; padding: 12px;
    }
    .step-alt { background: #eff6ff; border-color: #bfdbfe; }
    .step-num {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
      background: var(--primary); color: #fff; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; margin-top: 1px;
    }
    .step-alt .step-num { background: #1e40af; }
    .step-item strong { font-size: 13px; }
    .step-item p { margin: 4px 0 0; font-size: 12.5px; color: #334155; }
    .step-item code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 12px; font-weight: 600; }

    /* Simulator & Allocation */
    .two-col { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: stretch; scroll-margin-top: 68px; }
    .presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; font-size: 12.5px; }
    .pill, .strat-btn {
      border: 1px solid var(--border); background: #f8fafc; color: var(--text);
      padding: 5px 10px; border-radius: 999px; font-size: 12px; cursor: pointer; font-weight: 500;
    }
    .strat-btn { border-radius: 8px; }
    .pill:hover, .strat-btn:hover { border-color: var(--primary); }
    .pill.active { background: #eff6ff; border-color: var(--primary); color: var(--primary); font-weight: 600; }
    .strat-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

    .bar-wrap { margin-bottom: 16px; }
    .bar-header { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; margin-bottom: 6px; }
    .stacked-bar {
      width: 100%; height: 22px; border-radius: 7px; overflow: hidden; display: flex;
      background: #f1f5f9; border: 1px solid var(--border);
    }
    .seg { height: 100%; transition: width .2s ease; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .legend i, .alloc-list i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; padding-top: 12px; border-top: 1px solid var(--border); }
    .ctrl { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
    .ctrl-top { display: flex; justify-content: space-between; gap: 8px; }
    .ctrl input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
    .check-row { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .check-label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; user-select: none; }
    .check-label input { width: 15px; height: 15px; accent-color: var(--primary); }
    .callout-strip {
      margin-top: 12px; padding: 10px 12px; border-radius: 8px;
      background: #f8fafc; border: 1px solid var(--border); font-size: 12.5px; color: #334155;
    }

    .alloc-visual { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .donut { width: 170px; height: 170px; }
    .donut-big { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .donut-sm { font-size: 11px; fill: #64748b; }
    .alloc-list { list-style: none; padding: 0; margin: 0; width: 100%; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
    .alloc-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .mini-note { margin-top: 14px; padding: 10px 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; font-size: 12.5px; color: #166534; }

    /* Tables */
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; background: #f8fafc; }
    th.num, td.num { text-align: right; white-space: nowrap; }
    .group-row td { background: #f8fafc; font-weight: 600; font-size: 12px; color: #334155; padding-top: 11px; }
    .subtotal-row td { font-weight: 600; background: #fcfcfd; }
    .total-row td { font-weight: 700; background: #eff6ff; border-top: 2px solid #bfdbfe; border-bottom: none; font-size: 13.5px; }
    .table-foot { margin: 10px 0 0; font-size: 12px; color: var(--muted); }

    .warn-card { background: var(--warn-bg); border-color: var(--warn-border); }
    .missing-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .missing-item { background: rgba(255,255,255,0.78); border: 1px solid #fde68a; border-radius: 8px; padding: 12px; }
    .missing-item strong { display: block; font-size: 13px; margin-bottom: 4px; color: #92400e; }
    .missing-item p { margin: 0; font-size: 12.5px; color: #451a03; }
    .missing-item code { background: #fef3c7; padding: 1px 4px; border-radius: 4px; font-size: 12px; }

    @media (max-width: 920px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .option-grid, .two-col, .steps-grid { grid-template-columns: 1fr; }
      .yc-row { grid-template-columns: 170px 1fr; }
      .yc-tag { display: none; }
    }
    @media (max-width: 600px) {
      .kpi-grid, .controls-grid, .missing-grid { grid-template-columns: 1fr; }
      .topbar h1 { font-size: 20px; }
      .yc-row { grid-template-columns: 1fr; gap: 4px; }
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .card { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="lock-screen" class="lock-screen">
    <div id="lock-card" class="lock-card">
      <div class="lock-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1>Protected Financial Report</h1>
      <p>Enter the family password to decrypt and view this retirement &amp; senior living budget.</p>
      <form id="unlock-form" autocomplete="off">
        <div class="pw-group">
          <input id="pw-input" class="pw-input" type="password" placeholder="Enter password" autofocus required />
          <button type="button" id="pw-toggle" class="pw-toggle">Show</button>
        </div>
        <button type="submit" id="unlock-btn" class="btn-primary">Unlock Report</button>
      </form>
      <div id="lock-err" class="lock-err"></div>
      <div class="lock-foot">Encrypted client-side (PBKDF2-SHA256 + ChaCha20-HMAC)</div>
    </div>
  </div>

  <div id="app-root" style="display:none;"></div>

  <script>
    
(function(global){
  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);

  function sha256(msg) {
    const len = msg.length;
    const bitLenHi = Math.floor((len * 8) / 0x100000000);
    const bitLenLo = (len * 8) >>> 0;
    const padLen = ((len + 9 + 63) & ~63);
    const buf = new Uint8Array(padLen);
    buf.set(msg);
    buf[len] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(padLen - 8, bitLenHi, false);
    dv.setUint32(padLen - 4, bitLenLo, false);

    let h0=0x6a09e667, h1=0xbb67ae85, h2=0x3c6ef372, h3=0xa54ff53a;
    let h4=0x510e527f, h5=0x9b05688c, h6=0x1f83d9ab, h7=0x5be0cd19;
    const w = new Uint32Array(64);

    for (let i = 0; i < padLen; i += 64) {
      for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4, false);
      for (let t = 16; t < 64; t++) {
        const s0 = ((w[t-15] >>> 7) | (w[t-15] << 25)) ^ ((w[t-15] >>> 18) | (w[t-15] << 14)) ^ (w[t-15] >>> 3);
        const s1 = ((w[t-2] >>> 17) | (w[t-2] << 15)) ^ ((w[t-2] >>> 19) | (w[t-2] << 13)) ^ (w[t-2] >>> 10);
        w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
      }
      let a=h0, b=h1, c=h2, d=h3, e=h4, f=h5, g=h6, h=h7;
      for (let t = 0; t < 64; t++) {
        const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        const ch = (e & f) ^ (~e & g);
        const temp1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
        const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d + temp1) >>> 0;
        d=c; c=b; b=a; a=(temp1 + temp2) >>> 0;
      }
      h0=(h0+a)>>>0; h1=(h1+b)>>>0; h2=(h2+c)>>>0; h3=(h3+d)>>>0;
      h4=(h4+e)>>>0; h5=(h5+f)>>>0; h6=(h6+g)>>>0; h7=(h7+h)>>>0;
    }
    const out = new Uint8Array(32);
    const odv = new DataView(out.buffer);
    odv.setUint32(0,h0,false); odv.setUint32(4,h1,false); odv.setUint32(8,h2,false); odv.setUint32(12,h3,false);
    odv.setUint32(16,h4,false); odv.setUint32(20,h5,false); odv.setUint32(24,h6,false); odv.setUint32(28,h7,false);
    return out;
  }

  function hmacSha256(key, data) {
    let k = key.length > 64 ? sha256(key) : key;
    const ipad = new Uint8Array(64 + data.length);
    const opad = new Uint8Array(64 + 32);
    for (let i = 0; i < 64; i++) {
      const b = i < k.length ? k[i] : 0;
      ipad[i] = b ^ 0x36;
      opad[i] = b ^ 0x5c;
    }
    ipad.set(data, 64);
    opad.set(sha256(ipad), 64);
    return sha256(opad);
  }

  function pbkdf2Sha256(passwordBytes, salt, iterations, dkLen) {
    const blocks = Math.ceil(dkLen / 32);
    const out = new Uint8Array(blocks * 32);
    const blockInput = new Uint8Array(salt.length + 4);
    blockInput.set(salt);
    const dv = new DataView(blockInput.buffer);
    for (let b = 1; b <= blocks; b++) {
      dv.setUint32(salt.length, b, false);
      let u = hmacSha256(passwordBytes, blockInput);
      const t = new Uint8Array(u);
      for (let i = 1; i < iterations; i++) {
        u = hmacSha256(passwordBytes, u);
        for (let j = 0; j < 32; j++) t[j] ^= u[j];
      }
      out.set(t, (b - 1) * 32);
    }
    return out.subarray(0, dkLen);
  }

  function rotl(v, n) { return ((v << n) | (v >>> (32 - n))) >>> 0; }
  function qr(s, a, b, c, d) {

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function deriveKey(pwBytes, salt, iter) {
      if (typeof crypto !== "undefined" && crypto.subtle) {
        try {
          const baseKey = await crypto.subtle.importKey("raw", pwBytes, "PBKDF2", false, ["deriveBits"]);
          const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, baseKey, 512);
          return new Uint8Array(bits);
        } catch (_) {}
      }
      return window.__vaultCrypto.pbkdf2Sha256(pwBytes, salt, iter, 64);
    }

    async function decryptVault(password) {
      const vc = window.__vaultCrypto;
      const salt = b64ToBytes(VAULT.salt);
      const nonce = b64ToBytes(VAULT.nonce);
      const mac = b64ToBytes(VAULT.mac);
      const ct = b64ToBytes(VAULT.ct);
      const pwBytes = new TextEncoder().encode(password);
      const dk = await deriveKey(pwBytes, salt, VAULT.iter);
      const encKey = dk.subarray(0, 32);
      const macKey = dk.subarray(32, 64);

      const macInput = new Uint8Array(salt.length + nonce.length + ct.length);
      macInput.set(salt, 0);
      macInput.set(nonce, salt.length);
      macInput.set(ct, salt.length + nonce.length);
      const expectedMac = vc.hmacSha256(macKey, macInput);

      if (!vc.ctEqual(mac, expectedMac)) return null;
      const pt = vc.chacha20Xor(encKey, nonce, ct);
      const ds = new DecompressionStream("deflate-raw");
      const w = ds.writable.getWriter(); w.write(pt); w.close();
      const buf = await new Response(ds.readable).arrayBuffer();
      return JSON.parse(new TextDecoder().decode(buf));
    }

    function mountApp(payload) {
      document.title = payload.title;
      document.getElementById('lock-screen').style.display = 'none';
      const root = document.getElementById('app-root');
      root.innerHTML = payload.html;
      root.style.display = 'block';
      const s = document.createElement('script');
      s.textContent = payload.script;
      document.body.appendChild(s);
    }

    const pwInput = document.getElementById('pw-input');
    const pwToggle = document.getElementById('pw-toggle');
    const lockErr = document.getElementById('lock-err');
    const unlockBtn = document.getElementById('unlock-btn');
    const lockCard = document.getElementById('lock-card');

    pwToggle.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      pwToggle.textContent = show ? 'Hide' : 'Show';
    });

    document.getElementById('unlock-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const pw = pwInput.value;
      lockErr.textContent = '';
      unlockBtn.disabled = true;
      unlockBtn.textContent = 'Decrypting...';
      setTimeout(async () => {
        try {
          const payload = await decryptVault(pw);
          if (payload) {
            mountApp(payload);
          } else {
            lockErr.textContent = 'Incorrect password. Please try again.';
            lockCard.classList.remove('shake');
            void lockCard.offsetWidth;
            lockCard.classList.add('shake');
            pwInput.select();
          }
        } catch (err) {
          lockErr.textContent = 'Decryption error.';
        } finally {
          unlockBtn.disabled = false;
          unlockBtn.textContent = 'Unlock Report';
        }
      }, 30);
    });
  </script>
